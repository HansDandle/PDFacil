[project]
name = "pdfacil"
version = "0.1.0"
description = "Lightweight design tool with font-faithful Canva PDF import and editing"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "fonttools>=4.50",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
]

[project.scripts]
pdfacil = "pdfacil.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "numpy>=2.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/pdfacil"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Body", "fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["pdfacil", "tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
