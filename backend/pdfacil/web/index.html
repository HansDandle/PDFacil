<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDFacil</title>
<style>
  :root {
    --bg: #f4f3f0; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e2e0db;
    --accent: #e4572e; --accent-ink: #ffffff; --warn: #b7791f; --warn-bg: #fdf3e1;
    --box: rgba(228, 87, 46, 0.10); --box-line: rgba(228, 87, 46, 0.65); --sel: rgba(228, 87, 46, 0.14);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; letter-spacing: 0.2px; }
  header .file { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 32ch; }
  header .spacer { flex: 1; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: #c9c6bf; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.danger { color: #b3261e; }
  main { display: grid; grid-template-columns: 1fr 350px; gap: 16px; padding: 16px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-height: 60vh; }
  .pages { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .pages button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .canvas { position: relative; margin: 0 auto; box-shadow: 0 1px 6px rgba(0,0,0,0.12); background: #fff; touch-action: none; }
  .canvas img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .canvas.busy img { opacity: 0.55; transition: opacity 0.15s; }
  .el { position: absolute; border: 1px solid transparent; border-radius: 2px; cursor: move; }
  .el:hover { background: var(--box); border-color: var(--box-line); }
  .el.sel { background: var(--sel); border: 1.5px solid var(--accent); z-index: 3; }
  .el.dragging { background: rgba(228, 87, 46, 0.2); }
  .el.locked { cursor: not-allowed; }
  .el.locked:hover { background: rgba(0,0,0,0.04); border: 1px dashed #999; }
  .el.edited:not(.sel) { border-color: rgba(46, 125, 50, 0.7); }
  .el .badge { position: absolute; top: -9px; right: -9px; width: 18px; height: 18px; border-radius: 50%; background: var(--warn); color: #fff; font-size: 12px; line-height: 18px; text-align: center; font-weight: 700; pointer-events: none; }
  .el .handle { position: absolute; right: -6px; bottom: -6px; width: 12px; height: 12px; background: #fff; border: 2px solid var(--accent); border-radius: 2px; cursor: nwse-resize; }
  .drop { border: 2px dashed #cfccc4; border-radius: 12px; padding: 64px 24px; text-align: center; color: var(--muted); }
  .drop.over { border-color: var(--accent); color: var(--ink); background: #fff7f3; }
  .drop strong { color: var(--ink); display: block; font-size: 18px; margin-bottom: 6px; }
  aside { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin: 0 0 10px; }
  textarea { width: 100%; min-height: 120px; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .grid label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .grid label.wide { grid-column: 1 / -1; }
  .grid input, .grid select { font: inherit; color: var(--ink); padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: #fff; min-width: 0; }
  .grid input[type=color] { padding: 2px; height: 32px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .hint { color: var(--muted); font-size: 12px; }
  .fonts li { margin: 4px 0; font-size: 13px; }
  .fonts ul { list-style: none; padding: 0; margin: 0; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; margin-right: 6px; background: #e8f3ea; color: #2e6b35; }
  .tag.subset-only { background: var(--warn-bg); color: var(--warn); }
  .tag.missing { background: #fbe4e2; color: #b3261e; }
  .warn { background: var(--warn-bg); border: 1px solid #f1d49a; border-radius: 8px; padding: 10px; font-size: 13px; margin-top: 10px; }
  .warn label { display: block; margin: 4px 0; }
  .notice { background: #eef3fb; border: 1px solid #cddcf2; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 10px; }
  .empty { color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 12px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>PDFacil</h1>
  <span class="file" id="fileName"></span>
  <span class="spacer"></span>
  <button id="undoBtn" disabled title="Undo (Ctrl+Z)">Undo</button>
  <button id="resetBtn" disabled>Reset all</button>
  <label class="btn">Open PDF<input id="fileInput" type="file" accept="application/pdf" hidden></label>
  <button id="downloadBtn" class="primary" disabled>Download PDF</button>
</header>

<main>
  <section class="stage">
    <div id="notice"></div>
    <div class="pages" id="pages"></div>
    <div id="dropZone" class="drop">
      <strong>Drop a PDF here</strong>
      or use Open PDF. Canva exports keep their fonts; other PDFs open with no quality guarantee.
    </div>
    <div class="canvas" id="canvas" hidden><img id="pageImg" alt="Page preview"></div>
  </section>

  <aside>
    <div class="card">
      <h2 id="panelTitle">Selection</h2>
      <div id="editBody" class="empty">Open a PDF to start.</div>
    </div>
    <div class="card fonts">
      <h2>Fonts in this PDF</h2>
      <div id="fontList" class="empty">No document open.</div>
    </div>
  </aside>
</main>
<datalist id="fontFamilies"></datalist>
<footer>PDFacil is free software (AGPL-3.0). <a id="sourceLink" href="https://github.com/HansDandle/PDFacil">Source code</a></footer>

<script>
// ---- state -------------------------------------------------------------------------------
// changes: element id -> { edit: {runs, align, fontFallback}, bbox: [x0,y0,x1,y1], deleted }
const state = {
  session: null, pageCount: 0, page: 0, pages: {}, changes: {}, history: [],
  selected: null, warnings: [], boxes: {}, fonts: [], catalog: new Map(), busy: false, scale: 1,
};
const $ = (id) => document.getElementById(id);
const WEIGHTS = { 100: "Thin", 200: "ExtraLight", 300: "Light", 400: "Regular", 500: "Medium", 600: "SemiBold", 700: "Bold", 800: "ExtraBold", 900: "Black" };
const STYLE_WEIGHTS = Object.fromEntries(Object.entries(WEIGHTS).map(([w, n]) => [n.toLowerCase(), +w]));

function textOf(el) { return el.runs.map((r) => r.text).join(""); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function opsList() {
  const ops = [];
  for (const [id, c] of Object.entries(state.changes)) {
    if (c.deleted) { ops.push({ op: "delete", id }); continue; }
    if (c.bbox) ops.push({ op: "transform", id, bbox: c.bbox });
    if (c.edit) ops.push({ op: "editText", id, ...c.edit });
  }
  return ops;
}

// Where the element is now: the server's measured box for edited text (alignment and new
// fonts move text), else the box the user dragged it to, else where it was in the PDF.
function currentBBox(el) {
  const measured = state.boxes[el.id];
  if (measured && measured.length === 4) return measured;
  return (state.changes[el.id] && state.changes[el.id].bbox) || el.bbox;
}

function change(id, patch) {
  state.history.push(JSON.stringify(state.changes));
  const next = { ...(state.changes[id] || {}), ...patch };
  for (const k of Object.keys(next)) if (next[k] === undefined || next[k] === null) delete next[k];
  if (Object.keys(next).length) state.changes[id] = next; else delete state.changes[id];
  return refreshPreview().then(renderPanel);
}

function undo() {
  if (!state.history.length) return;
  state.changes = JSON.parse(state.history.pop());
  refreshPreview().then(renderPanel);
}

// ---- fonts ---------------------------------------------------------------------------------
function splitFontName(name) {
  // "Montserrat-Bold", "Open Sans-SemiBoldItalic", "Montserrat Bold" -> {family, weight, italic}
  let family = name, style = "";
  if (name.includes("-")) [family, style] = [name.slice(0, name.indexOf("-")), name.slice(name.indexOf("-") + 1)];
  else {
    const words = name.split(" ");
    while (words.length > 1 && (STYLE_WEIGHTS[words.at(-1).toLowerCase()] || /italic|oblique/i.test(words.at(-1)))) style = words.pop() + style;
  }
  if (!name.includes("-")) family = name.slice(0, name.length - style.length).trim();
  const italic = /italic|oblique/i.test(style);
  const weight = STYLE_WEIGHTS[style.toLowerCase().replace(/italic|oblique/g, "")] || 400;
  family = family.replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/([A-Z])([A-Z][a-z])/g, "$1 $2");
  return { family, weight, italic };
}

function fontName(family, weight, italic) {
  let style = WEIGHTS[weight] || "Regular";
  if (italic) style = style === "Regular" ? "Italic" : style + "Italic";
  return `${family}-${style}`;
}

async function loadCatalog() {
  try {
    const res = await api("/fonts/catalog");
    const { families } = await res.json();
    state.catalog = new Map(families.map((f) => [f.family.toLowerCase(), f]));
    $("fontFamilies").innerHTML = families.map((f) => `<option value="${escapeHtml(f.family)}">`).join("");
  } catch { /* offline: only the PDF's own fonts */ }
}

// New text keeps the element's styling: the dominant run's style, except characters the
// original drew in another run (Canva draws glyphs its font lacks in a fallback font).
function dominantStyle(el) {
  const keys = ["font", "size", "color"];
  const counts = new Map();
  for (const r of el.runs) {
    const k = JSON.stringify(keys.map((f) => r[f]));
    counts.set(k, (counts.get(k) || 0) + r.text.trim().length);
  }
  const best = [...counts.entries()].sort((a, b) => b[1] - a[1])[0][0];
  return Object.fromEntries(JSON.parse(best).map((v, i) => [keys[i], v]));
}

function runsFor(el, text, style) {
  const keys = ["font", "size", "color"];
  const dominant = { ...dominantStyle(el), ...style };
  const perChar = new Map();
  if (!style.font) {
    for (const r of el.runs) {
      if (keys.some((f) => r[f] !== dominantStyle(el)[f])) {
        for (const ch of r.text) if (!perChar.has(ch)) perChar.set(ch, { font: r.font, size: dominant.size, color: dominant.color });
      }
    }
  }
  const runs = [];
  for (const ch of text) {
    const s = perChar.get(ch) || dominant;
    const last = runs[runs.length - 1];
    if (last && keys.every((f) => last[f] === s[f])) last.text += ch;
    else runs.push({ text: ch, ...s });
  }
  return runs.length ? runs : [{ text: "", ...dominant }];
}

// ---- server --------------------------------------------------------------------------------
async function api(path, options = {}) {
  const res = await fetch(path, options);
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return res;
}

async function openPdf(file) {
  const form = new FormData();
  form.append("file", file);
  setBusy(true);
  try {
    const res = await api("/sessions", { method: "POST", body: form });
    const s = await res.json();
    Object.assign(state, { session: s.id, pageCount: s.pageCount, page: 0, pages: {}, changes: {}, history: [], selected: null, warnings: [] });
    $("fileName").textContent = s.filename;
    $("notice").innerHTML = s.notice ? `<div class="notice">${escapeHtml(s.notice)}</div>` : "";
    $("dropZone").hidden = true;
    $("canvas").hidden = false;
    await loadFonts();
    await showPage(0);
  } catch (e) {
    alert("Could not open this PDF: " + e.message);
  } finally {
    setBusy(false);
  }
}

async function loadFonts() {
  const res = await api(`/sessions/${state.session}/fonts`);
  state.fonts = (await res.json()).fonts;
  $("fontList").className = "";
  $("fontList").innerHTML = "<ul>" + state.fonts.map((f) =>
    `<li><span class="tag ${f.status}">${f.status}</span>${escapeHtml(f.name)}${f.family && f.family !== f.name ? ` <span class="meta">→ ${escapeHtml(f.family)}</span>` : ""}</li>`
  ).join("") + "</ul>";
}

function renderPageTabs() {
  const box = $("pages");
  box.innerHTML = "";
  if (state.pageCount < 2) return;
  for (let i = 0; i < state.pageCount; i++) {
    const b = document.createElement("button");
    b.textContent = `Page ${i + 1}`;
    b.className = i === state.page ? "on" : "";
    b.onclick = () => showPage(i);
    box.appendChild(b);
  }
}

async function showPage(n) {
  state.page = n;
  state.selected = null;
  renderPageTabs();
  if (!state.pages[n]) {
    const res = await api(`/sessions/${state.session}/pages/${n}`);
    state.pages[n] = await res.json();
  }
  await refreshPreview();
  renderPanel();
}

async function refreshPreview() {
  setBusy(true);
  try {
    const res = await api(`/sessions/${state.session}/preview`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ops: opsList(), page: state.page, scale: 2 }),
    });
    const report = JSON.parse(res.headers.get("X-PDFacil-Warnings") || "{}");
    state.warnings = report.warnings || [];
    state.boxes = report.boxes || {};
    const img = $("pageImg");
    const url = URL.createObjectURL(await res.blob());
    await new Promise((resolve) => { img.onload = resolve; img.src = url; });
    renderOverlay();
  } catch (e) {
    alert("Preview failed: " + e.message);
  } finally {
    setBusy(false);
  }
}

// ---- page overlay: select, drag to move, corner handle to resize ---------------------------
function renderOverlay() {
  const canvas = $("canvas");
  canvas.querySelectorAll(".el").forEach((n) => n.remove());
  const page = state.pages[state.page];
  if (!page) return;
  const width = Math.min(canvas.parentElement.clientWidth - 24, page.width * 1.5);
  canvas.style.width = width + "px";
  state.scale = width / page.width;
  const warned = new Set(state.warnings.filter((w) => w.code !== "text-overflow").map((w) => w.id));
  for (const el of page.elements) {
    if (el.locked && el.type !== "text") continue; // backgrounds, outlined text: not selectable
    const c = state.changes[el.id] || {};
    if (c.deleted) continue;
    const d = document.createElement("div");
    d.className = "el" + (el.locked ? " locked" : "") + (state.selected === el.id ? " sel" : "") + (state.changes[el.id] ? " edited" : "");
    d.dataset.id = el.id;
    placeBox(d, currentBBox(el));
    d.title = el.locked ? "Locked (" + (el.lockedReason || "") + ")" : (el.type === "text" ? textOf(el).slice(0, 80) : el.type);
    if (warned.has(el.id)) d.insertAdjacentHTML("beforeend", '<span class="badge">!</span>');
    if (!el.locked) {
      if (state.selected === el.id) d.insertAdjacentHTML("beforeend", '<span class="handle"></span>');
      d.addEventListener("pointerdown", (e) => startDrag(e, el, d));
    }
    canvas.appendChild(d);
  }
}

function placeBox(d, [x0, y0, x1, y1]) {
  const k = state.scale, pad = 2;
  Object.assign(d.style, { left: (x0 - pad) * k + "px", top: (y0 - pad) * k + "px", width: (x1 - x0 + 2 * pad) * k + "px", height: (y1 - y0 + 2 * pad) * k + "px" });
}

function startDrag(e, el, box) {
  if (state.busy) return;
  e.preventDefault();
  const resizing = e.target.classList.contains("handle");
  const start = currentBBox(el).slice();
  // A move shifts the block's own box (so alignment keeps its room); only the corner handle
  // sets an explicit width.
  const base = ((state.changes[el.id] && state.changes[el.id].bbox) || el.bbox).slice();
  const sx = e.clientX, sy = e.clientY;
  let moved = false, next = start, commit = base;
  box.setPointerCapture(e.pointerId);
  box.classList.add("dragging");
  const onMove = (ev) => {
    const dx = (ev.clientX - sx) / state.scale, dy = (ev.clientY - sy) / state.scale;
    if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 3) moved = true;
    if (!moved) return;
    const [x0, y0, x1, y1] = start;
    if (resizing) {
      const w = Math.max(8, x1 - x0 + dx);
      const h = el.type === "image" ? w * (y1 - y0) / (x1 - x0) : Math.max(8, y1 - y0 + dy);
      next = [x0, y0, x0 + w, y0 + h];
      commit = next;
    } else {
      next = [x0 + dx, y0 + dy, x1 + dx, y1 + dy];
      commit = [base[0] + dx, base[1] + dy, base[2] + dx, base[3] + dy];
    }
    placeBox(box, next);
  };
  const onUp = () => {
    box.removeEventListener("pointermove", onMove);
    box.removeEventListener("pointerup", onUp);
    box.classList.remove("dragging");
    if (moved) {
      state.selected = el.id;
      change(el.id, { bbox: commit.map((v) => Math.round(v * 100) / 100) });
    } else {
      state.selected = el.id;
      renderOverlay();
      renderPanel();
    }
  };
  box.addEventListener("pointermove", onMove);
  box.addEventListener("pointerup", onUp);
}

// ---- side panel ----------------------------------------------------------------------------
function selectedElement() {
  const page = state.pages[state.page];
  return page && page.elements.find((e) => e.id === state.selected);
}

function renderPanel() {
  const body = $("editBody");
  const el = selectedElement();
  if (!el) {
    $("panelTitle").textContent = "Selection";
    body.className = "empty";
    body.innerHTML = state.session ? "Click something on the page to edit it. Drag to move; drag the corner handle to resize." : "Open a PDF to start.";
    return;
  }
  body.className = "";
  const c = state.changes[el.id] || {};
  const moved = c.bbox ? '<button id="resetPosBtn">Reset position</button>' : "";
  if (el.type !== "text") {
    $("panelTitle").textContent = el.type === "image" ? "Image" : "Shape";
    body.innerHTML = `<div class="hint">Drag to move. Drag the corner handle to resize${el.type === "image" ? " (keeps proportions)" : ""}. Arrow keys nudge 1 pt, Shift+arrow 10 pt.</div>
      <div class="row">${moved}<button class="danger" id="deleteBtn">Delete</button></div>`;
    $("deleteBtn").onclick = () => { state.selected = null; change(el.id, { deleted: true }); };
    if (c.bbox) $("resetPosBtn").onclick = () => change(el.id, { bbox: null });
    return;
  }

  $("panelTitle").textContent = el.list ? (el.list.type === "number" ? "Numbered list" : "Bulleted list") : "Text";
  const edit = c.edit || {};
  const runs = edit.runs || el.runs;
  const style = dominantStyle({ runs });
  const original = dominantStyle(el);
  const parsed = splitFontName(style.font);
  const entry = state.catalog.get(parsed.family.toLowerCase());
  body.innerHTML = `
    <textarea id="textInput"></textarea>
    ${el.list ? '<div class="meta">One item per line; markers follow the items.</div>' : ""}
    <div class="meta">Alignment uses the free space around the block. For an exact box, drag the corner handle first.</div>
    <div class="grid">
      <label class="wide">Font <input id="fontFamily" list="fontFamilies" value="${escapeHtml(parsed.family)}" placeholder="Any Google Font"></label>
      <label>Style <select id="fontStyle"></select></label>
      <label>Size (pt) <input id="fontSize" type="number" min="4" max="400" step="0.5" value="${style.size}"></label>
      <label>Color <input id="fontColor" type="color" value="${style.color.length === 7 ? style.color : "#000000"}"></label>
      <label>Align <select id="align">${["left", "center", "right", "justified"].map((a) => `<option ${((edit.align || el.align) === a) ? "selected" : ""}>${a}</option>`).join("")}</select></label>
    </div>
    <div class="meta">Now: ${escapeHtml(original.font)} · <span class="tag ${el.fontStatus}">${el.fontStatus}</span></div>
    <div class="row">
      <button class="primary" id="applyBtn">Apply</button>
      ${moved}
      <button id="revertBtn" ${state.changes[el.id] ? "" : "disabled"}>Revert</button>
      <button class="danger" id="deleteBtn">Delete</button>
    </div>
    <div id="warnBox"></div>`;
  $("textInput").value = runs.map((r) => r.text).join("");
  fillStyles(entry, parsed);
  $("fontFamily").oninput = () => fillStyles(state.catalog.get($("fontFamily").value.trim().toLowerCase()), parsed);
  $("applyBtn").onclick = () => applyText(el);
  $("revertBtn").onclick = () => change(el.id, { edit: null, bbox: null, deleted: null });
  $("deleteBtn").onclick = () => { state.selected = null; change(el.id, { deleted: true }); };
  if (c.bbox) $("resetPosBtn").onclick = () => change(el.id, { bbox: null });
  renderWarnings(el, edit);
}

function fillStyles(entry, parsed) {
  const select = $("fontStyle");
  const styles = entry ? entry.styles : [`${parsed.weight}${parsed.italic ? "i" : ""}`];
  select.innerHTML = styles.map((s) => {
    const w = parseInt(s, 10), it = s.endsWith("i");
    const label = (WEIGHTS[w] || w) + (it ? " Italic" : "");
    return `<option value="${s}">${label.replace("Regular Italic", "Italic")}</option>`;
  }).join("");
  const want = `${parsed.weight}${parsed.italic ? "i" : ""}`;
  select.value = styles.includes(want) ? want : styles.includes("400") ? "400" : styles[0];
}

function applyText(el) {
  const text = $("textInput").value;
  const family = $("fontFamily").value.trim();
  const styleValue = $("fontStyle").value;
  const weight = parseInt(styleValue, 10), italic = styleValue.endsWith("i");
  const original = dominantStyle(el);
  const parsedOriginal = splitFontName(original.font);
  const fontChanged = family.toLowerCase() !== parsedOriginal.family.toLowerCase() || weight !== parsedOriginal.weight || italic !== parsedOriginal.italic;
  const style = { size: parseFloat($("fontSize").value) || original.size, color: $("fontColor").value.toUpperCase() };
  if (fontChanged) {
    if (!state.catalog.has(family.toLowerCase())) {
      alert(`"${family}" is not in Google Fonts. Pick a family from the list, or upload the font file from a font warning.`);
      return;
    }
    style.font = fontName(state.catalog.get(family.toLowerCase()).family, weight, italic);
  }
  const prev = (state.changes[el.id] || {}).edit || {};
  const edit = { runs: runsFor(el, text, style) };
  const align = $("align").value;
  if (align !== el.align) edit.align = align;
  if (prev.fontFallback) edit.fontFallback = prev.fontFallback;
  change(el.id, { edit });
}

function renderWarnings(el, edit) {
  const box = $("warnBox");
  const ws = state.warnings.filter((w) => w.id === el.id);
  if (!ws.length) { box.innerHTML = ""; return; }
  const parts = [];
  for (const w of ws) {
    if (w.code === "text-overflow") {
      parts.push(`<div class="warn">The text no longer fits its original box and runs below it.</div>`);
    } else if (w.code === "font-substituted" || w.code === "font-mismatch-kept") {
      const f = w.fonts.find((x) => x.missing.length) || w.fonts[0];
      const choice = edit.fontFallback || "substitute";
      parts.push(`<div class="warn">
        <strong>${escapeHtml(f.font)}</strong> is missing ${f.missing.map((c) => `"${escapeHtml(c)}"`).join(", ")} in this PDF.
        <label><input type="radio" name="fb" value="substitute" ${choice === "substitute" ? "checked" : ""}> Use ${escapeHtml(f.substitute || "a similar font")} for the whole block</label>
        <label><input type="radio" name="fb" value="keep" ${choice === "keep" ? "checked" : ""}> Keep ${escapeHtml(f.font)}; only the missing characters differ</label>
        <label class="btn" style="display:inline-block;margin-top:6px">Upload the real font…<input type="file" accept=".ttf,.otf" hidden id="fontUpload" data-font="${escapeHtml(f.font)}"></label>
      </div>`);
    } else if (w.code === "glyphs-missing") {
      parts.push(`<div class="warn">${escapeHtml(w.font)} has no glyph for ${w.missing.map(escapeHtml).join(" ")}.</div>`);
    }
  }
  box.innerHTML = parts.join("");
  box.querySelectorAll('input[name="fb"]').forEach((r) => r.onchange = () => {
    const current = (state.changes[el.id] || {}).edit;
    if (current) change(el.id, { edit: { ...current, fontFallback: r.value } });
  });
  const upload = $("fontUpload");
  if (upload) upload.onchange = () => uploadFont(upload.dataset.font, upload.files[0]);
}

async function uploadFont(name, file) {
  if (!file) return;
  const form = new FormData();
  form.append("name", name);
  form.append("file", file);
  try {
    await api(`/sessions/${state.session}/fonts/map`, { method: "POST", body: form });
    await loadFonts();
    const selected = state.selected;
    state.pages = {};
    await showPage(state.page);
    state.selected = selected;
    renderOverlay(); renderPanel();
  } catch (e) {
    alert("Font upload failed: " + e.message);
  }
}

// ---- export, misc ----------------------------------------------------------------------------
async function download() {
  setBusy(true);
  try {
    const res = await api(`/sessions/${state.session}/export`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ops: opsList() }),
    });
    const disposition = res.headers.get("Content-Disposition") || "";
    const name = (disposition.match(/filename="([^"]+)"/) || [, "edited.pdf"])[1];
    const url = URL.createObjectURL(await res.blob());
    const a = Object.assign(document.createElement("a"), { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) {
    alert("Export failed: " + e.message);
  } finally {
    setBusy(false);
  }
}

function setBusy(on) { state.busy = on; $("canvas").classList.toggle("busy", on); updateButtons(); }
function updateButtons() {
  $("undoBtn").disabled = state.busy || !state.history.length;
  $("resetBtn").disabled = state.busy || !Object.keys(state.changes).length;
  $("downloadBtn").disabled = state.busy || !state.session;
}

function typing() { return ["TEXTAREA", "INPUT", "SELECT"].includes(document.activeElement.tagName); }

$("fileInput").onchange = (e) => e.target.files[0] && openPdf(e.target.files[0]);
$("undoBtn").onclick = undo;
$("resetBtn").onclick = () => { state.history.push(JSON.stringify(state.changes)); state.changes = {}; refreshPreview().then(renderPanel); };
$("downloadBtn").onclick = download;
window.addEventListener("resize", renderOverlay);
document.addEventListener("keydown", (e) => {
  if (typing()) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); return; }
  const el = selectedElement();
  if (!el || el.locked || state.busy) return;
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); state.selected = null; change(el.id, { deleted: true }); return; }
  if (e.key === "Escape") { state.selected = null; renderOverlay(); renderPanel(); return; }
  const step = e.shiftKey ? 10 : 1;
  const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
  if (d) {
    e.preventDefault();
    const [x0, y0, x1, y1] = (state.changes[el.id] && state.changes[el.id].bbox) || el.bbox;
    change(el.id, { bbox: [x0 + d[0], y0 + d[1], x1 + d[0], y1 + d[1]] });
  }
});
const drop = $("dropZone");
["dragenter", "dragover"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
document.addEventListener("drop", (e) => { const f = e.dataTransfer.files[0]; if (f && f.type === "application/pdf") openPdf(f); });
fetch("/source").then((r) => r.json()).then((s) => { $("sourceLink").href = s.url; }).catch(() => {});
loadCatalog();
</script>
